name: CI

# Compiles everything and produces an ad-hoc signed test DMG as a workflow artifact.
# Needs no Apple Developer credentials; signed + notarized builds come from build-release.yml.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.planning/**']
  pull_request:
    paths-ignore: ['**.md', '.planning/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Raycast extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src

      - name: Prettier
        run: npx prettier --check src

  build:
    name: Build & package test DMG
    # macos-26 defaults to Xcode 26: the hint bar uses macOS 26 SDK APIs (NSGlassEffectView,
    # GlassEffectContainer). `#available` only guards at runtime, so older SDKs fail to compile.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build number = commit count, same as releases

      - name: Compute build info
        run: |
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install tools
        run: brew install create-dmg xcodegen

      - name: Build Swift package (Raycast extension binary)
        run: swift build --package-path swift/DesignRuler

      - name: Generate Xcode project
        run: cd App && xcodegen generate

      - name: Build app (ad-hoc signed)
        run: |
          cd App
          xcodebuild build \
            -project "Design Ruler.xcodeproj" \
            -scheme "Design Ruler" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
          echo "APP_PATH=$RUNNER_TEMP/DerivedData/Build/Products/Release/Design Ruler.app" >> "$GITHUB_ENV"

      - name: Verify app bundle
        run: |
          PLIST="$APP_PATH/Contents/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          echo "Built version $VERSION ($BUILD)"
          test "$BUILD" = "$BUILD_NUMBER" || { echo "CFBundleVersion not stamped from build settings"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          scripts/check-library-validation.sh "$APP_PATH"

      - name: Create DMG
        run: |
          DMG="$RUNNER_TEMP/Design-Ruler-$VERSION-$SHORT_SHA-unsigned.dmg"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          scripts/create-dmg.sh "$APP_PATH" "$DMG"
          # Show what testers will see (expect: app, Applications link, hidden styling files)
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          hdiutil detach "$MNT"

      - name: Upload test DMG
        uses: actions/upload-artifact@v4
        with:
          name: Design-Ruler-${{ env.VERSION }}-${{ env.SHORT_SHA }}-unsigned
          path: ${{ runner.temp }}/Design-Ruler-*-unsigned.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Smoke-test launch from the DMG
        run: |
          # Install the app exactly as a tester would (copy out of the DMG), then launch it.
          # LSUIElement menu bar app: no window, so "launched" = process still alive after a few seconds.
          # Runners have SIP disabled, so library validation isn't enforced here — that's covered by
          # check-library-validation.sh above. This catches other crashes at launch.
          csrutil status || true
          mkdir -p "$RUNNER_TEMP/smoke"
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG_PATH" >/dev/null
          ditto "$MNT/Design Ruler.app" "$RUNNER_TEMP/smoke/Design Ruler.app"
          hdiutil detach "$MNT" >/dev/null
          SMOKE_APP="$RUNNER_TEMP/smoke/Design Ruler.app"
          codesign -dvv "$SMOKE_APP" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier|flags|Runtime' || true
          spctl --assess --type execute -vv "$SMOKE_APP" 2>&1 || true   # informational: ad-hoc is expected to be rejected
          START=$(date '+%Y-%m-%d %H:%M:%S')
          open "$SMOKE_APP"
          sleep 10
          screencapture -x "$RUNNER_TEMP/smoke/screen.png" 2>/dev/null || true
          echo "--- logs from Design Ruler since launch ---"
          log show --start "$START" --style compact --predicate 'process == "Design Ruler"' 2>/dev/null | tail -60 || true
          if pgrep -x "Design Ruler" >/dev/null; then
            echo "OK: Design Ruler is running 10s after launch"
            pkill -x "Design Ruler" || true
          else
            echo "FAIL: Design Ruler is not running 10s after launch"
            for f in ~/Library/Logs/DiagnosticReports/Design*Ruler*; do
              [ -e "$f" ] && { echo "=== $f"; head -120 "$f"; }
            done
            exit 1
          fi

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ env.SHORT_SHA }}
          path: ${{ runner.temp }}/smoke/screen.png
          if-no-files-found: ignore
          retention-days: 14

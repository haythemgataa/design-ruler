name: Build & Release

# A version tag builds the app and attaches the DMG to a draft release. With the Developer ID
# secrets set, the app is signed and the DMG notarized; without them the release gets an ad-hoc
# signed DMG ("-unsigned"), built like ci.yml's test DMG, with install notes.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'  # app versions only: milestone tags like v1.2 don't build

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Draft Release
    # macOS 26 SDK (Xcode 26) required — see ci.yml
    runs-on: macos-26

    env:
      DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Choose signed or unsigned build
        run: |
          # All six secrets sign, none builds unsigned, and anything in between is a setup mistake
          SET=0
          for name in DEVELOPER_ID_CERT_BASE64 DEVELOPER_ID_CERT_PASSWORD KEYCHAIN_PASSWORD APPLE_ID NOTARY_PASSWORD TEAM_ID; do
            if [ -n "${!name}" ]; then SET=$((SET + 1)); fi
          done
          if [ "$SET" -eq 6 ]; then
            echo "SIGNED=true" >> $GITHUB_ENV
            echo "DMG_NAME=Design-Ruler-$VERSION.dmg" >> $GITHUB_ENV
          elif [ "$SET" -eq 0 ]; then
            echo "SIGNED=false" >> $GITHUB_ENV
            echo "DMG_NAME=Design-Ruler-$VERSION-unsigned.dmg" >> $GITHUB_ENV
            echo "::notice::No Developer ID secrets are set, so this release gets an unsigned DMG"
          else
            echo "::error::Only $SET of the 6 Developer ID secrets are set. Set all six to sign, or none for an unsigned release"
            exit 1
          fi

      - name: Install tools
        run: brew install create-dmg xcodegen

      - name: Import signing certificate
        if: env.SIGNED == 'true'
        run: |
          echo -n "$DEVELOPER_ID_CERT_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Generate Xcode project
        run: cd App && xcodegen generate

      - name: Archive (signed)
        if: env.SIGNED == 'true'
        run: |
          cd App
          xcodebuild archive \
            -project "Design Ruler.xcodeproj" \
            -scheme "Design Ruler" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/DesignRuler.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"

      - name: Export (signed)
        if: env.SIGNED == 'true'
        run: |
          cd App
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DesignRuler.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "ExportOptions.plist"
          echo "APP_PATH=$RUNNER_TEMP/export/Design Ruler.app" >> $GITHUB_ENV

      - name: Build (unsigned)
        if: env.SIGNED != 'true'
        run: |
          cd App
          xcodebuild build \
            -project "Design Ruler.xcodeproj" \
            -scheme "Design Ruler" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO
          # Hardened runtime off: an ad-hoc app has no Team ID, so library validation would refuse
          # the embedded Sparkle framework at launch (see ci.yml)
          echo "APP_PATH=$RUNNER_TEMP/DerivedData/Build/Products/Release/Design Ruler.app" >> $GITHUB_ENV

      - name: Verify app bundle
        run: |
          PLIST="$APP_PATH/Contents/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          echo "Built version $SHORT ($BUILD)"
          test "$SHORT" = "$VERSION" || { echo "CFBundleShortVersionString $SHORT does not match the tag"; exit 1; }
          test "$BUILD" = "$BUILD_NUMBER" || { echo "CFBundleVersion not stamped from build settings"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          scripts/check-library-validation.sh "$APP_PATH"

      - name: Create DMG
        run: scripts/create-dmg.sh "$APP_PATH" "$RUNNER_TEMP/$DMG_NAME"

      - name: Notarize DMG
        if: env.SIGNED == 'true'
        run: |
          # Credentials passed directly: a stored keychain profile would land in the default
          # keychain, which the search list above no longer includes.
          xcrun notarytool submit "$RUNNER_TEMP/$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/$DMG_NAME"

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          if [ "$SIGNED" != "true" ]; then
            cat > "$NOTES" <<'EOF'
          ## Installing this build

          This build isn't signed with a Developer ID or notarized, so macOS blocks it the first time you open it.

          1. Open the DMG and drag **Design Ruler** to Applications.
          2. Open it once. When macOS refuses, go to **System Settings → Privacy & Security** and click **Open Anyway**. Or run:
             ```
             xattr -dr com.apple.quarantine "/Applications/Design Ruler.app"
             ```
          3. Grant **Screen Recording** when asked. Each unsigned build counts as a new app to macOS, so if an older version was installed, its entry no longer applies: in **System Settings → Privacy & Security → Screen Recording**, remove Design Ruler with **−**, then add it again with **+**.

          Design Ruler is in beta and unsigned builds can't update themselves: **Check GitHub for Updates** in the menu bar opens this page.

          EOF
          fi
          # Changes since the previous app version. Starting from the previous vX.Y.Z tag: otherwise
          # GitHub picks the newest tag it can reach, like the v1.3 milestone tag
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          ARGS=(-f tag_name="$GITHUB_REF_NAME")
          if [ -n "$PREV" ]; then ARGS+=(-f previous_tag_name="$PREV"); fi
          # One maintainer, so no author credits: "Title by @user in <url>" becomes "Title (#N)".
          # Also drops New Contributors, and the compare link on a first release (it would start at v1.3)
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body \
            | sed -E 's| by @[^ ]+ in https://github\.com/[^ ]+/pull/([0-9]+)$| (#\1)|' \
            | awk -v prev="$PREV" '
                /^## New Contributors/ { skip = 1; next }
                skip && /^\*\*Full Changelog\*\*/ { skip = 0 }
                skip { next }
                /^\*\*Full Changelog\*\*/ && prev == "" { next }
                { print }' \
            | awk '
                # Features first, then fixes, then the rest, each group in merge order. Grouped by
                # the PR title: "feat:" / "feat(scope):" (or a plain "Feat "), same for fix
                function flush(  g) { for (g = 1; g <= 3; g++) printf "%s", group[g]; delete group; n = 0 }
                /^\* / {
                  title = tolower(substr($0, 3))
                  if (title ~ /^feat[(:! ]/) g = 1
                  else if (title ~ /^fix[(:! ]/) g = 2
                  else g = 3
                  group[g] = group[g] $0 "\n"; n++; next
                }
                n { flush() }
                { print }
                END { if (n) flush() }' >> "$NOTES"
          echo "NOTES=$NOTES" >> $GITHUB_ENV

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 0.x is the beta. Unsigned builds can't update themselves, so they're marked pre-release;
          # signed ones stay regular releases because Sparkle's feed (releases/latest) skips
          # pre-releases
          TITLE="Design Ruler $VERSION"
          case "$VERSION" in 0.*) TITLE="$TITLE Beta" ;; esac
          FLAGS=()
          if [ "$SIGNED" != "true" ]; then FLAGS=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/$DMG_NAME" \
            --draft \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            "${FLAGS[@]}"

      - name: Cleanup keychain
        if: always() && env.SIGNED == 'true'
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true

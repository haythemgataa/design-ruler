name: Update Appcast

# Publishing a release signs its DMG for Sparkle and attaches appcast.xml. Skipped until the
# SPARKLE_PRIVATE_KEY secret exists: without it Sparkle can't verify an update.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate-appcast:
    name: Generate & Upload Appcast
    runs-on: macos-15

    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check for the Sparkle key
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SKIP=true" >> $GITHUB_ENV
            echo "::notice::SPARKLE_PRIVATE_KEY is not set, so this release gets no appcast"
          fi

      - name: Checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release info
        if: env.SKIP != 'true'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Download DMG from release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --pattern "*.dmg" \
            --dir "$RUNNER_TEMP"
          # Signed releases ship Design-Ruler-X.Y.Z.dmg, unsigned ones Design-Ruler-X.Y.Z-unsigned.dmg
          DMG_NAME=$(basename "$(ls "$RUNNER_TEMP"/*.dmg | head -1)")
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$DMG_NAME" >> $GITHUB_ENV

      - name: Download Sparkle tools
        if: env.SKIP != 'true'
        run: |
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz" \
            -o /tmp/Sparkle.tar.xz
          mkdir -p /tmp/sparkle-tools
          tar xf /tmp/Sparkle.tar.xz -C /tmp/sparkle-tools

      - name: Generate EdDSA signature
        if: env.SKIP != 'true'
        run: |
          SIGN_OUTPUT=$(echo "$SPARKLE_PRIVATE_KEY" | /tmp/sparkle-tools/bin/sign_update --ed-key-file - "$RUNNER_TEMP/$DMG_NAME")
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          FILE_LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          echo "ED_SIGNATURE=$ED_SIGNATURE" >> $GITHUB_ENV
          echo "FILE_LENGTH=$FILE_LENGTH" >> $GITHUB_ENV

      - name: Generate appcast.xml
        if: env.SKIP != 'true'
        run: |
          export VERSION BUILD_NUMBER ED_SIGNATURE FILE_LENGTH DOWNLOAD_URL
          export REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          chmod +x scripts/generate-appcast.sh
          scripts/generate-appcast.sh "$RUNNER_TEMP/appcast.xml"

      - name: Upload appcast.xml to release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/appcast.xml" \
            --clobber
